# Check on real machines: Windows, Ubuntu, Mac with Apple silicon and Intel.
# Runs on demand (Actions, "Check", Run workflow) and on version tags. "pakete" also builds and starts the packaged
# apps. "release" or a version tag (git tag v1.2.0 && git push origin v1.2.0) also publishes them as a release, once
# each app has started on its own system; without a tag, the version comes from app/fenster/package.json.
name: Check

on:
  workflow_dispatch:
    inputs:
      pakete:
        description: "Also build and start the packaged apps (takes longer)"
        type: boolean
        default: false
      release:
        description: "Publish the packaged apps as a release (version from app/fenster/package.json)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NUMPY: "2.5.4"
  SOUNDFILE: "0.14.0"

jobs:
  quelltext:
    name: Source on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy==${{ env.NUMPY }}" "soundfile==${{ env.SOUNDFILE }}"
      - run: python tests/check_translations.py
      - run: python tests/rauchtest.py

  fenster-pakete:
    name: Build and start the Linux app
    if: inputs.pakete || inputs.release || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: echo "OPENLIBARY_BAU=$RUNNER_TEMP/bau" >> "$GITHUB_ENV"
      - run: bash app/pythons_holen.sh linux
      - run: npm ci
        working-directory: app/fenster
      - run: |
          bash app/fenster_paket.sh linux "$RUNNER_TEMP/paket"
          ls -la "$RUNNER_TEMP/paket"
      - name: Install the Linux app (.deb) and check it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          sudo apt-get install -y -q "$RUNNER_TEMP"/paket/*Linux.deb
          PY="/opt/Open Libary/resources/python/bin/python3"
          "$PY" tests/rauchtest.py --python "$PY" --code "/opt/Open Libary/resources/openlibary"
          xvfb-run -a open-libary > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8765/api/stand | grep -q '"paket": true' && { echo "The app started its server"; ok=1; break; }
            sleep 1
          done
          pkill -f "/opt/Open Libary" || true
          [ "${ok:-}" = 1 ] || { cat "$RUNNER_TEMP/app.log"; tail -50 ~/.local/share/open-libary/openlibary.log || true; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            ${{ runner.temp }}/paket/*Linux.deb
            ${{ runner.temp }}/paket/*Linux.tar.gz
          retention-days: 1

  windows-paket:
    # on a Mac: electron-builder builds the installer's uninstaller with wine on Linux, natively on macOS
    name: Build the Windows app (zip and Setup.exe)
    if: inputs.pakete || inputs.release || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: echo "OPENLIBARY_BAU=$RUNNER_TEMP/bau" >> "$GITHUB_ENV"
      - run: bash app/pythons_holen.sh windows
      - run: npm ci
        working-directory: app/fenster
      - run: |
          bash app/fenster_paket.sh windows "$RUNNER_TEMP/paket"
          ls -la "$RUNNER_TEMP/paket"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            ${{ runner.temp }}/paket/*Windows.zip
            ${{ runner.temp }}/paket/*Windows-Setup.exe
          retention-days: 1

  windows-app:
    name: Start the Windows app
    needs: windows-paket
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: ${{ runner.temp }}/paket
      - name: Check the package Python and the app
        shell: pwsh
        run: |
          $ziel = "$env:RUNNER_TEMP\app"
          Expand-Archive -Path (Get-ChildItem "$env:RUNNER_TEMP\paket\*Windows.zip").FullName -DestinationPath $ziel
          $py = "$ziel\resources\python\python.exe"
          & $py tests\rauchtest.py --python $py --code "$ziel\resources\openlibary"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $app = Start-Process -FilePath "$ziel\Open Libary.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $s = Invoke-RestMethod http://127.0.0.1:8765/api/stand -TimeoutSec 2
              if ($s.paket -and $s.system -eq "windows") { $ok = $true; break }
            } catch {}
            Start-Sleep 1
          }
          Write-Host "The app started its server: $ok"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Get-Content "$env:APPDATA\Open Libary\openlibary.log" -Tail 50 -ErrorAction SilentlyContinue; exit 1 }
      - name: Install with the Setup.exe, start, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP\paket\*Windows-Setup.exe").FullName
          Start-Process -FilePath $setup -ArgumentList "/S" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\open-libary"
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Open Libary.lnk"
          $key = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
                 Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Open Libary*" }
          if (-not (Test-Path "$dir\Open Libary.exe")) { Write-Host "not installed in $dir"; exit 1 }
          if (-not (Test-Path $lnk)) { Write-Host "no Start menu entry"; exit 1 }
          if (-not $key) { Write-Host "no entry in Apps & features"; exit 1 }
          Write-Host "Installed, Start menu entry and Apps & features entry present"
          $app = Start-Process -FilePath "$dir\Open Libary.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $s = Invoke-RestMethod http://127.0.0.1:8765/api/stand -TimeoutSec 2
              if ($s.paket -and $s.system -eq "windows") { $ok = $true; break }
            } catch {}
            Start-Sleep 1
          }
          Write-Host "The installed app started its server: $ok"
          if (-not $ok) { exit 1 }
          # the uninstaller has to close the running app (and its Python) by itself
          Start-Process -FilePath "$dir\Uninstall Open Libary.exe" -ArgumentList "/currentuser", "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\Open Libary.exe"); $i++) { Start-Sleep 1 }
          if ((Test-Path "$dir\Open Libary.exe") -or (Test-Path $lnk)) { Write-Host "uninstall left files behind"; exit 1 }
          Write-Host "Uninstalled"

  mac-paket:
    name: Build and start the Mac app (Apple silicon)
    if: inputs.pakete || inputs.release || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: echo "OPENLIBARY_BAU=$RUNNER_TEMP/bau" >> "$GITHUB_ENV"
      - run: bash app/pythons_holen.sh mac
      - run: bash app/app_paket.sh "$RUNNER_TEMP/paket"
      - name: Check the package Python and the app
        run: bash tests/mac_app_pruefen.sh "$RUNNER_TEMP"/paket/*Mac.zip arm64
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: ${{ runner.temp }}/paket/*Mac.zip
          retention-days: 1

  mac-intel:
    name: Start the Mac app (Intel)
    needs: mac-paket
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-app
          path: ${{ runner.temp }}/paket
      - run: bash tests/mac_app_pruefen.sh "$RUNNER_TEMP"/paket/*Mac.zip x86_64

  release:
    name: Publish the release
    if: inputs.release || startsWith(github.ref, 'refs/tags/v')
    needs: [fenster-pakete, windows-app, mac-intel]   # each app has started on its own system
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app/fenster/package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true
      - name: Name the packages by version and publish them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            *)            tag="v$(jq -r .version app/fenster/package.json)" ;;
          esac
          v="${tag#v}"
          for f in pakete/*; do                  # "Open Libary 2026-11-03 Windows.zip" -> "Open-Libary-1.2.0-Windows.zip"
            n="$(basename "$f")"; mv "$f" "pakete/Open-Libary-$v-${n##* }"
          done
          ls -la pakete
          gh release create "$tag" pakete/* --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Open Libary $v" \
            --notes "Download the package for your computer below; nothing else has to be installed. Step by step, including the first start of an unsigned app: [GUIDE.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/GUIDE.md).

          | Computer | Package |
          |---|---|
          | Windows 10 or 11, 64-bit | \`Open-Libary-$v-Windows-Setup.exe\` (or \`Open-Libary-$v-Windows.zip\` without installing) |
          | Mac, Apple chip (macOS 11+) or Intel (macOS 10.15+) | \`Open-Libary-$v-Mac.zip\` |
          | Linux: Ubuntu, Mint, Debian | \`Open-Libary-$v-Linux.deb\` |
          | Linux: others | \`Open-Libary-$v-Linux.tar.gz\` |"
